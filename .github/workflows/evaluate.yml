name: Generate verified model results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute independent credit-risk benchmark
        run: python -m src.train --output-dir results --no-shap
      - name: Publish verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/metrics.json results/model_comparison.json results/evaluation.png
          if ! git diff --cached --quiet; then
            git commit -m "Add automatically generated verified credit-risk results"
            git push
          fi
